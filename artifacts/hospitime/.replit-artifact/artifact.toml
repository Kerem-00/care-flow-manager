kind = "web"
previewPath = "/"
title = "HospiTime - ICU Visitor Booking"
version = "1.0.0"
id = "artifacts/hospitime"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25433

[services.development]
run = "pnpm --filter @workspace/hospitime run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hospitime", "run", "build" ]
publicDir = "artifacts/hospitime/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25433"
BASE_PATH = "/"
